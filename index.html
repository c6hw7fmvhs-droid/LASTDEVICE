<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>LAST DEVICE</title>
<style>
:root{
  --bg:#0b0c0f;--phone:#111318;--surface:#1b1e25;--surface2:#252933;
  --text:#f4f4f5;--muted:#9da3af;--line:rgba(255,255,255,.1);
  --accent:#b7c4d8;--safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:18px;background:
 radial-gradient(ellipse at 50% 20%,rgba(73,82,99,.2),transparent 45%),
 linear-gradient(145deg,#101216,#08090b 70%)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.phone{position:relative;width:min(100%,390px);height:min(844px,calc(100svh - 36px));min-height:620px;background:#08090c;border:1px solid #444953;border-radius:43px;padding:9px;box-shadow:0 28px 90px #000b,0 0 0 5px #20232a;overflow:hidden}
.screen{height:100%;position:relative;overflow:hidden;border-radius:34px;background:#111318}
.status{position:absolute;z-index:20;top:0;left:0;right:0;height:42px;padding:12px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;font-weight:650;pointer-events:none}
.status-right{display:flex;gap:6px;align-items:center}
.status svg{width:14px;height:14px;fill:currentColor}
.dynamic-island{position:absolute;z-index:21;top:9px;left:50%;transform:translateX(-50%);width:104px;height:27px;border-radius:20px;background:#030304}
.view{position:absolute;inset:0;display:none;overflow:auto;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.active{display:block}
.lock-view{background:linear-gradient(180deg,rgba(9,12,19,.22),rgba(6,8,12,.75)),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1000&q=85') center/cover}
.lock-content{height:100%;display:flex;flex-direction:column;align-items:center;padding:80px 24px 28px;text-align:center}
.lock-date{font-size:15px;color:#e1e4e9;text-shadow:0 2px 10px #0008}
.lock-time{font-size:76px;line-height:1.05;letter-spacing:-5px;font-weight:300;margin:8px 0 26px;text-shadow:0 2px 18px #0008}
.notification{width:100%;text-align:left;padding:14px 15px;background:rgba(35,39,47,.76);border:1px solid #ffffff20;border-radius:18px;backdrop-filter:blur(22px);margin-top:12px}
.notif-top{display:flex;justify-content:space-between;color:#d8dbe0;font-size:11px;margin-bottom:7px}
.notif-title{font-size:13px;font-weight:700;margin-bottom:4px}
.notif-text{font-size:13px;color:#e3e5e9;line-height:1.4}
.lock-bottom{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center}
.round-control{width:44px;height:44px;border-radius:50%;background:#252a32a8;border:1px solid #ffffff30;display:grid;place-items:center;backdrop-filter:blur(12px)}
.round-control svg{width:19px;height:19px;fill:none;stroke:white;stroke-width:1.8}
.slide-unlock{width:100%;margin-top:22px;padding:0 2px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.slide-track{height:52px;position:relative;border-radius:10px;background:linear-gradient(180deg,#3a3d43,#17191e 55%,#292c32);border:1px solid #555b65;box-shadow:inset 0 1px 2px #ffffff24,0 3px 12px #0008;overflow:hidden}
.slide-fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#aeb9c8aa,#dce4f044);pointer-events:none}
.slide-label{position:absolute;inset:0;display:grid;place-items:center;color:#d4d7dd;font-size:14px;letter-spacing:.02em;text-shadow:0 1px 2px #000;pointer-events:none;transition:opacity .15s}
.slide-thumb{position:absolute;z-index:2;left:3px;top:3px;width:58px;height:44px;border-radius:7px;background:linear-gradient(180deg,#f5f6f7,#bfc4cb);border:1px solid #fff;box-shadow:0 2px 5px #0008;display:grid;place-items:center;touch-action:none;padding:0}
.slide-thumb svg{width:25px;height:25px;fill:none;stroke:#515965;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.slide-unlock.unlocked .slide-label{opacity:0}
.slide-unlock.unlocked .slide-thumb{background:linear-gradient(180deg,#dce9dd,#9bbca0)}
@media(max-width:430px){.slide-track{height:54px}.slide-thumb{height:46px}}
.home-view{background:
 linear-gradient(180deg,rgba(12,15,22,.3),rgba(9,11,16,.82)),
 url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1000&q=85') center/cover}
.home-content{height:100%;padding:62px 21px calc(24px + var(--safe-bottom));display:flex;flex-direction:column}
.home-date{font-size:12px;color:#e0e3e8;text-align:center;margin-bottom:7px}

.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-items:center;align-items:start;column-gap:10px;row-gap:27px}
.app{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;background:none;padding:0;min-width:0;width:100%}
.app-icon{width: min(100%,68px);aspect-ratio:1/1;height:auto;border-radius:18px;display:grid;place-items:center;box-shadow:0 5px 14px #0005;position:relative;flex:0 0 auto}
.app-icon svg{width:27px;height:27px;stroke:white;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-label{font-size:10px;color:#fff;text-shadow:0 1px 5px #000;white-space:nowrap}
.icon-message{background:linear-gradient(145deg,#57d66c,#159b49)}
.icon-phone{background:linear-gradient(145deg,#67d77b,#1a9b51)}
.icon-photo{background:linear-gradient(145deg,#f3c86d,#c96d6b)}
.icon-calendar{background:linear-gradient(145deg,#fff,#e8e8e8);color:#e44}
.icon-calendar svg{stroke:#e34b4b}
.icon-note{background:linear-gradient(145deg,#ffe58a,#d4a844)}
.icon-browser{background:linear-gradient(145deg,#69c7ed,#3864b9)}
.icon-voice{background:linear-gradient(145deg,#e88c9b,#a34b6b)}
.icon-files{background:linear-gradient(145deg,#8ab8f5,#426bb3)}
.icon-settings{background:linear-gradient(145deg,#8c929e,#4c525d)}
.icon-mail{background:linear-gradient(145deg,#77aaf7,#3868bc)}
.dock{margin-top:auto;display:flex;justify-content:space-around;padding:12px 9px;background:#dce1e833;border:1px solid #ffffff26;border-radius:24px;backdrop-filter:blur(22px)}
.dock .app-icon{width:58px;height:auto;aspect-ratio:1/1;border-radius:16px}
.home-indicator{position:absolute;z-index:30;bottom:7px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:5px;background:#fff;opacity:.9}
.app-view{background:#111318;padding-top:48px}
.app-header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#111318ed;backdrop-filter:blur(15px);z-index:5}
.back-btn{background:none;color:#9db9e8;font-size:14px;padding:8px 0;min-width:60px;text-align:left}
.app-header-title{font-size:16px;font-weight:650}
.header-action{min-width:60px;text-align:right;color:#9db9e8;font-size:13px}
.app-body{padding:20px 18px 42px}
.eyebrow{font-size:10px;letter-spacing:.14em;color:#858d9b;font-weight:700}
.section-title{font-size:23px;letter-spacing:-.7px;margin:8px 0 7px}
.subtext{font-size:13px;color:var(--muted);line-height:1.6}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:13px}
.row{display:flex;align-items:center;gap:12px}
.avatar{width:39px;height:39px;border-radius:50%;background:#333b49;display:grid;place-items:center;color:#d8e1f0;font-weight:700}
.item-title{font-size:14px;font-weight:650}
.item-sub{font-size:12px;color:var(--muted);margin-top:4px}
.chevron{margin-left:auto;color:#727b89;font-size:20px}
.message-bubble{max-width:84%;padding:11px 13px;border-radius:17px;font-size:13px;line-height:1.5;margin:12px 0;background:#303640}
.message-bubble.mine{margin-left:auto;background:#2869bf}
.message-time{text-align:center;color:#737b88;font-size:10px;margin:17px 0}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}
.photo-placeholder{aspect-ratio:1;background:linear-gradient(145deg,#353d49,#171b22);border-radius:12px;display:grid;place-items:center;color:#a8b0bc;overflow:hidden}
.photo-placeholder svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.4}
.note-paper{background:#e7e0cc;color:#27251f;border-radius:10px;padding:20px;min-height:210px;font-family:Georgia,serif;line-height:1.8;font-size:14px;transform:rotate(-.3deg)}
.locked-card{display:flex;align-items:center;gap:12px}
.locked-symbol{width:40px;height:40px;background:#303846;border-radius:12px;display:grid;place-items:center}
.locked-symbol svg{width:20px;height:20px;stroke:#aab6c9;fill:none;stroke-width:1.7}
.primary-btn{width:100%;padding:14px;border-radius:13px;background:#dce4f0;color:#151a22;font-weight:700;margin-top:15px}
.secondary-btn{width:100%;padding:13px;border-radius:13px;background:#292e38;color:#e8ebf0;margin-top:9px}
.empty-state{text-align:center;padding:46px 12px;color:#858d9b}
.empty-state svg{width:36px;height:36px;stroke:#778191;fill:none;stroke-width:1.4;margin-bottom:12px}
.toast{position:absolute;z-index:50;left:50%;bottom:40px;transform:translate(-50%,20px);opacity:0;background:#303640;color:white;border:1px solid #ffffff22;padding:10px 15px;border-radius:20px;font-size:12px;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.passcode-overlay{position:absolute;z-index:40;inset:0;background:#0c0e13f5;display:none;align-items:center;justify-content:center;padding:25px}
.passcode-overlay.show{display:flex}
.passcode-box{width:100%;max-width:280px;text-align:center}
.passcode-box h2{font-size:21px;margin:0 0 8px}
.passcode-box p{font-size:12px;color:#9da3af;margin:0 0 25px}
.dots{display:flex;justify-content:center;gap:13px;margin:25px 0}
.dot{width:9px;height:9px;border:1px solid #aab2c0;border-radius:50%}
.dot.filled{background:#f4f4f5;border-color:#f4f4f5}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{height:57px;border-radius:50%;background:#272c35;font-size:22px;font-weight:400}
.key:active{background:#414957}
.passcode-cancel{background:none;color:#aab3c2;margin-top:22px;font-size:13px}
@media(max-width:430px){body{padding:0;background:#08090b}.phone{width:100vw;height:100svh;min-height:560px;border:0;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}.dynamic-island{top:9px}}
@media(max-height:680px){.phone{min-height:0}.home-content{padding-top:54px}.app-grid{row-gap:18px}.app-icon{width:min(100%,60px)}}
</style>
</head>
<body>
<main class="phone" aria-label="LAST DEVICE mobile phone">
  <div class="screen">
    <div class="status"><span id="statusTime">9:41</span><span class="status-right"><svg viewBox="0 0 20 20"><path d="M2 7.5C6.5 3.5 13.5 3.5 18 7.5L10 17z"/></svg><svg viewBox="0 0 20 20"><path d="M2 6h16v11H2zM5 3h10v3H5z"/></svg><span>100%</span></span></div>
    <div class="dynamic-island"></div>

    <section class="view lock-view active" id="lockView">
      <div class="lock-content">
        <div class="lock-date" id="lockDate">11월 4일 수요일</div>
        <div class="lock-time" id="lockTime">23:17</div>
        <div class="notification">
          <div class="notif-top"><span>메시지 · 알림</span><span>방금 전</span></div>
          <div class="notif-title">알 수 없는 발신자</div>
          <div class="notif-text">이번에는 나를 찾지 마.</div>
        </div>
        <div class="lock-bottom">
          <button class="round-control" aria-label="손전등" onclick="showToast('손전등 기능은 준비 중입니다.')">
            <svg viewBox="0 0 24 24"><path d="M9 3h6l1 5-2 2v9l-2 2-2-2v-9L8 8zM9 8h6"/></svg>
          </button>
          <button class="round-control" aria-label="카메라" onclick="showToast('카메라 기능은 준비 중입니다.')">
            <svg viewBox="0 0 24 24"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          </button>
        </div>
        <div class="slide-unlock" id="slideUnlock" aria-label="밀어서 잠금 해제">
          <div class="slide-track">
            <div class="slide-fill" id="slideFill"></div>
            <div class="slide-label" id="slideLabel">밀어서 잠금 해제</div>
            <button class="slide-thumb" id="slideThumb" type="button" aria-label="오른쪽으로 밀어 잠금 해제">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="view home-view" id="homeView">
      <div class="home-content">
        <div class="home-date" id="homeDate">수요일, 11월 4일</div>
        <div class="app-grid">
          <button class="app" onclick="openApp('messages')"><span class="app-icon icon-message"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-3.5-.8L4 20l1.3-3.6A7.1 7.1 0 0 1 4 12c0-4.1 3.6-7.5 8-7.5s8 3.1 8 7z"/></svg></span><span class="app-label">메시지</span></button>
          <button class="app" onclick="openApp('phone')"><span class="app-icon icon-phone"><svg viewBox="0 0 24 24"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 3a14 14 0 0 1-6-6l3-2z"/></svg></span><span class="app-label">전화</span></button>
          <button class="app" onclick="openApp('photos')"><span class="app-icon icon-photo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3"/><path d="M12 4.5V9m7.5 3H15M12 19.5V15m-7.5-3H9"/></svg></span><span class="app-label">사진</span></button>
          <button class="app" onclick="openApp('calendar')"><span class="app-icon icon-calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M4 9h16"/><path d="M8 13h2m4 0h2m-8 4h2"/></svg></span><span class="app-label">캘린더</span></button>
          <button class="app" onclick="openApp('notes')"><span class="app-icon icon-note"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 9h6M9 13h6M9 17h4"/></svg></span><span class="app-label">메모</span></button>
          <button class="app" onclick="openApp('browser')"><span class="app-icon icon-browser"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9z"/></svg></span><span class="app-label">Safari</span></button>
          <button class="app" onclick="openApp('voice')"><span class="app-icon icon-voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></svg></span><span class="app-label">음성 메모</span></button>
          <button class="app" onclick="openApp('files')"><span class="app-icon icon-files"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/></svg></span><span class="app-label">파일</span></button>
        </div>
        <div class="dock">
          <button class="app" onclick="openApp('messages')"><span class="app-icon icon-message"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-3.5-.8L4 20l1.3-3.6A7.1 7.1 0 0 1 4 12c0-4.1 3.6-7.5 8-7.5s8 3.1 8 7z"/></svg></span></button>
          <button class="app" onclick="openApp('phone')"><span class="app-icon icon-phone"><svg viewBox="0 0 24 24"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 3a14 14 0 0 1-6-6l3-2z"/></svg></span></button>
          <button class="app" onclick="openApp('photos')"><span class="app-icon icon-photo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3"/></svg></span></button>
          <button class="app" onclick="openApp('browser')"><span class="app-icon icon-browser"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9z"/></svg></span></button>
        </div>
      </div>
    </section>

    <section class="view app-view" id="appView">
      <header class="app-header">
        <button class="back-btn" onclick="goHome()">‹ 홈</button>
        <div class="app-header-title" id="appTitle">메시지</div>
        <div class="header-action" id="appAction"></div>
      </header>
      <div class="app-body" id="appBody"></div>
    </section>

    <div class="passcode-overlay" id="passcodeOverlay">
      <div class="passcode-box">
        <h2>암호 입력</h2>
        <p>이 iPhone을 잠금 해제하려면 암호를 입력하십시오.</p>
        <div class="dots" id="passDots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
        <div class="keypad">
          <button class="key" onclick="pressKey('1')">1</button><button class="key" onclick="pressKey('2')">2</button><button class="key" onclick="pressKey('3')">3</button>
          <button class="key" onclick="pressKey('4')">4</button><button class="key" onclick="pressKey('5')">5</button><button class="key" onclick="pressKey('6')">6</button>
          <button class="key" onclick="pressKey('7')">7</button><button class="key" onclick="pressKey('8')">8</button><button class="key" onclick="pressKey('9')">9</button>
          <span></span><button class="key" onclick="pressKey('0')">0</button><button class="key" onclick="pressKey('del')">⌫</button>
        </div>
        <button class="passcode-cancel" onclick="closePasscode()">취소</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="home-indicator" id="homeIndicator"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let passcode = "";
let currentView = "lock";
let touchStartY = 0;

function updateClock(){
  const now = new Date();
  const time = now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
  const date = now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
  $('statusTime').textContent = time;
  $('lockTime').textContent = time;
  $('lockDate').textContent = date;
  $('homeDate').textContent = date;
}
updateClock(); setInterval(updateClock,15000);

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $(id).classList.add('active');
}
function unlock(){
  showView('homeView');
  currentView='home';
  showToast('잠금이 해제되었습니다.');
}
function closePasscode(){ $('passcodeOverlay').classList.remove('show'); }
function pressKey(k){
  if(k==='del'){passcode=passcode.slice(0,-1);}
  else if(passcode.length<4){passcode+=k;}
  updateDots();
  if(passcode.length===4){
    setTimeout(()=>{
      // 기본 화면 구조 확인용 임시 암호. 실제 퍼즐 암호로 교체 예정.
      if(passcode==='1104'){
        closePasscode();showView('homeView');currentView='home';
        showToast('잠금이 해제되었습니다.');
      }else{
        passcode='';updateDots();showToast('암호가 올바르지 않습니다.');
      }
    },180);
  }
}
function updateDots(){document.querySelectorAll('#passDots .dot').forEach((d,i)=>d.classList.toggle('filled',i<passcode.length));}
function goHome(){showView('homeView');currentView='home';}
function openApp(name){
  const data=apps[name]; if(!data)return;
  $('appTitle').textContent=data.title;
  $('appAction').textContent=data.action||'';
  $('appBody').innerHTML=data.html;
  showView('appView');currentView='app';
  $('appView').scrollTop=0;
}
function showToast(message){
  const t=$('toast');t.textContent=message;t.classList.add('show');
  clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2100);
}
const apps={
 messages:{title:'메시지',action:'편집',html:`

const slideControl = $('slideUnlock');
const slideThumb = $('slideThumb');
const slideFill = $('slideFill');
const slideLabel = $('slideLabel');
let dragging = false;
let dragStartX = 0;
let thumbStartX = 0;

function sliderMax(){
  return Math.max(0, slideControl.clientWidth - slideThumb.offsetWidth - 6);
}
function setSliderPosition(x){
  const max = sliderMax();
  const next = Math.max(0, Math.min(max, x));
  slideThumb.style.left = (3 + next) + 'px';
  slideFill.style.width = (next + slideThumb.offsetWidth + 3) + 'px';
  slideLabel.style.opacity = String(1 - Math.min(1, next / Math.max(1, max)) * .85);
  return next;
}
function finishSlider(){
  const max = sliderMax();
  const current = parseFloat(slideThumb.style.left || '3') - 3;
  if(current >= max * .82){
    slideControl.classList.add('unlocked');
    slideThumb.style.left = (3 + max) + 'px';
    slideFill.style.width = '100%';
    setTimeout(unlock, 160);
  }else{
    slideThumb.style.left = '3px';
    slideFill.style.width = '0';
    slideLabel.style.opacity = '1';
  }
}
slideThumb.addEventListener('pointerdown', e=>{
  if(currentView !== 'lock') return;
  dragging = true;
  dragStartX = e.clientX;
  thumbStartX = parseFloat(slideThumb.style.left || '3') - 3;
  slideThumb.setPointerCapture(e.pointerId);
});
slideThumb.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const moved = setSliderPosition(thumbStartX + e.clientX - dragStartX);
  if(moved >= sliderMax() * .82){
    dragging = false;
    finishSlider();
  }
});
slideThumb.addEventListener('pointerup', ()=>{
  if(!dragging) return;
  dragging = false;
  finishSlider();
});
slideThumb.addEventListener('pointercancel', ()=>{
  dragging = false;
  finishSlider();
});
$('homeIndicator').addEventListener('click',()=>{if(currentView==='app')goHome();else if(currentView==='home'){showView('lockView');currentView='lock';}});
document.addEventListener('keydown',e=>{
  if($('passcodeOverlay').classList.contains('show')){
    if(/^\d$/.test(e.key))pressKey(e.key);
    if(e.key==='Backspace')pressKey('del');
    if(e.key==='Escape')closePasscode();
  }else if(e.key==='Escape'&&currentView==='app')goHome();
});
</script>
